name: Feature request
description: Suggest a serializer rule, type or UI improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: textarea
    id: serializer
    attributes:
      label: Serializer behavior reference (docs or real output)
