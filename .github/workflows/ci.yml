name: CI

on:
  push:
    branches: [ main, 'claude/**', 'release/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Test
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release -NoBuild
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn

  vsix:
    name: Package VSIX (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Configuration Release
      - name: Inspect VSIX contents
        shell: pwsh
        run: ./build/inspect-vsix.ps1
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: RealizeJSON-vsix
          path: artifacts/vsix/*.vsix
          if-no-files-found: error
