name: Release

# Publishes a GitHub Release when a version tag (v1.2.3 or v1.2.3-preview.1) is pushed.
# Manual runs, and pull requests that touch the release inputs, build and verify the release artifacts without
# publishing (dry run): the publish job only runs for tags.
on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build/**'
      - 'src/RealizeJSON.VisualStudio/**'
      - 'CHANGELOG.md'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $version = ./build/check-version.ps1 -Tag $tag
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release
      - name: Test
        shell: pwsh
        run: ./build/test.ps1 -Configuration Release -NoBuild
      - name: Package VSIX
        shell: pwsh
        run: ./build/package.ps1 -Configuration Release
      - name: Inspect VSIX
        shell: pwsh
        run: ./build/inspect-vsix.ps1
      - name: Release notes
        shell: pwsh
        run: ./build/release-notes.ps1 -Version '${{ steps.version.outputs.version }}' -OutFile artifacts/release/release-notes.md
      - name: Collect release files
        shell: pwsh
        run: |
          Copy-Item artifacts/vsix/* artifacts/release/
          Get-ChildItem artifacts/release | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: artifacts/release
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # 0.x versions and tags with a suffix are published as pre-releases.
          prerelease=""
          if [[ "$VERSION" == 0.* || "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RealizeJSON $TAG" \
            --notes-file release/release-notes.md \
            --verify-tag \
            $prerelease \
            release/RealizeJSON-*.vsix release/SHA256SUMS.txt
